<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday Salman Arif 🎉</title>
<meta name="description" content="A birthday celebration page for Salman Arif." />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- confetti layer -->
  <canvas id="confetti"></canvas>

  <!-- floating balloons -->
  <div class="balloons" aria-hidden="true">
    <span>🎈</span><span>🎈</span><span>🎈</span><span>🎈</span>
    <span>🎈</span><span>🎈</span><span>🎈</span><span>🎈</span>
  </div>

  <main class="wrap">
    <p class="eyebrow">It's your day</p>
    <h1 class="title">Happy Birthday</h1>
    <h2 class="name">Salman Arif</h2>

    <div class="photo-ring">
      <img src="assets/salman.png" alt="Salman Arif" />
    </div>

    <div class="cake">
      <button id="cakeBtn" aria-label="Blow out the candle">🎂🕯️</button>
      <p id="cakeHint">Tap the cake to blow out the candle</p>
    </div>

    <div class="wish-card">
      <p id="wishText">May your year be full of laughter and adventure!</p>
      <button id="wishBtn">Another wish 🎁</button>
    </div>

    <p class="sign">With love, from your brother Fahad ❤️</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
